[build-system]
requires = ["setuptools", "wheel"]

[project]
authors = [
    {name = 'Christos Kotsalos', email = 'christos.kotsalos@cscs.ch'},
    {name = 'Nicoletta Farabullini', email = 'nicoletta.farabullini@c2sm.ethz.ch'},
]
dependencies = [
    "click",
    "numpy",
    "xarray",
    "humanize",
    "streamlit",
    "scikit-learn",
    "pandas",
    "pyarrow",
    "scipy",
    "dask[complete]",
    "h5py >=3.11",
    "zarr >=3.1.3,<3.5",  # dc_toolkit uses zarr.core.sync and zarr.codecs.numcodecs._codecs, private APIs
    "numcodecs",
    "zfpy",
    "pcodec",
    "tqdm",
    "matplotlib",
    "netCDF4",
    "h5netcdf",
    "plotly",
    "cfgrib",
    "psutil",
]
description = 'Data compression tool for Weather and Climate data'
name = 'dc_toolkit'
readme = {file = 'README.md', content-type = 'text/markdown'}
requires-python = '>=3.11'
version = '0.0'

[project.optional-dependencies]
# EBCC needs cmake, a C/C++ toolchain and HDF5 headers at build time.
ebcc = ["ebcc[zarr] @ git+https://github.com/spcl/EBCC.git@d99377f71e6854ec57f793f106f7ba75ae31fed5"]
test = ["pytest >=8"]

[project.scripts]
dc_toolkit = 'dc_toolkit.cli:cli'

[project.entry-points."zarr.codecs"]
# Any zarr client with dc_toolkit installed (plus ebcc, for EBCC) decodes these codecs; dc_toolkit.codecs
# needs neither MPI nor the rest of the package.
"numcodecs.ebcc_filter" = "dc_toolkit.codecs:EBCC"
# ZFPY on each chunk flattened to 1-D.  Its bytes are plain zfp; it needs a name of its own because
# a pipeline's identity is its JSON and "numcodecs.zfpy" is the rank-wise encoder (ZFPYRank).
"numcodecs.zfpy_flat" = "dc_toolkit.codecs:ZFPYFlat"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "mpi: starts dc_toolkit through DC_TOOLKIT_MPIEXEC (e.g. 'mpirun --oversubscribe -n {n}', 'srun --ntasks={n}')",
    "slow: measures a rank's memory on a 256 MiB sample",
    "ebcc: needs the optional ebcc package",
]
