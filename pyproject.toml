[build-system]
requires = ["setuptools", "wheel"]

[project]
authors = [
    {name = 'Christos Kotsalos', email = 'christos.kotsalos@cscs.ch'},
    {name = 'Nicoletta Farabullini', email = 'nicoletta.farabullini@c2sm.ethz.ch'},
]
dependencies = [
    "click",
    "pyyaml",
    "numpy",
    "xarray",
    "humanize",
    "streamlit",
    "scikit-learn",
    "pandas",
    "pyarrow",
    "scipy",
    "PyWavelets",
    "dask[complete]",
    "h5py >=3.11",
    "zarr >=3.1.1",
    "numcodecs",
    "json5",
    "rich",
    "zfpy",
    "pcodec",
    "tqdm",
    "matplotlib",
    "netCDF4",
    "h5netcdf",
    "plotly",
    "cfgrib",
    "psutil",
]
description = 'Data compression tool for Weather and Climate data'
name = 'dc_toolkit'
readme = {file = 'README.md', content-type = 'text/markdown'}
requires-python = '>=3.11'
version = '0.0'

[project.optional-dependencies]
# EBCC needs cmake, a C/C++ toolchain and HDF5 headers at build time.
ebcc = ["ebcc[zarr] @ git+https://github.com/spcl/EBCC.git"]

[project.scripts]
dc_toolkit = 'dc_toolkit.cli:cli'

[project.entry-points."zarr.codecs"]
# Lets any zarr client with dc_toolkit + ebcc installed decode EBCC-compressed arrays.
"numcodecs.ebcc_filter" = "dc_toolkit.utils:EBCC"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
