[build-system]
requires = ["setuptools", "wheel"]

[project]
authors = [
    {name = 'Christos Kotsalos', email = 'christos.kotsalos@cscs.ch'},
    {name = 'Nicoletta Farabullini', email = 'nicoletta.farabullini@c2sm.ethz.ch'},
]
dependencies = [
    "pystac",
    "click",
    "pyyaml",
    "numpy",
    "xarray",
    "humanize",
    "streamlit",
    "tslearn",
    "scipy",
    "PyWavelets",
    "dask[complete]",
    "h5py >=3.11",
    "zarr >=3.1.1",
    "numcodecs",
    "zarr-any-numcodecs >=0.1.3",
    "json5",
    "rich",
    "zfpy",
    "pcodec",
    "tqdm",
    "matplotlib",
    "netCDF4",
    "h5netcdf",
    "plotly",
    "cfgrib",
    "psutil",
]
description = 'Data compression tool for Weather and Climate data'
name = 'dc_toolkit'
readme = {file = 'README.md', content-type = 'text/markdown'}
requires-python = '>=3.11'
version = '0.0'

[project.scripts]
dc_toolkit = 'dc_toolkit.cli:cli'

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
