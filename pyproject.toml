[build-system]
requires = ["setuptools", "wheel"]

[project]
authors = [
    {name = 'Christos Kotsalos', email = 'christos.kotsalos@cscs.ch'},
    {name = 'Nicoletta Farabullini', email = 'nicoletta.farabullini@c2sm.ethz.ch'},
]
dependencies = [
    "click",
    "numpy",
    "xarray",
    "humanize",
    "streamlit",
    "scikit-learn",
    "pandas",
    "pyarrow",
    "scipy",
    "dask[complete]",
    "h5py >=3.11",
    "zarr >=3.1.3",
    "numcodecs",
    "zfpy",
    "pcodec",
    "tqdm",
    "matplotlib",
    "netCDF4",
    "h5netcdf",
    "plotly",
    "cfgrib",
    "psutil",
]
description = 'Data compression tool for Weather and Climate data'
name = 'dc_toolkit'
readme = {file = 'README.md', content-type = 'text/markdown'}
requires-python = '>=3.11'
version = '0.0'

[project.optional-dependencies]
# EBCC needs cmake, a C/C++ toolchain and HDF5 headers at build time.
ebcc = ["ebcc[zarr] @ git+https://github.com/spcl/EBCC.git"]

[project.scripts]
dc_toolkit = 'dc_toolkit.cli:cli'

[project.entry-points."zarr.codecs"]
# Any zarr client with dc_toolkit and mpi4py installed (plus ebcc, for EBCC) decodes these
# codecs: both entry points import dc_toolkit.utils, which imports mpi4py (not a declared dependency).
"numcodecs.ebcc_filter" = "dc_toolkit.utils:EBCC"
# ZFPY on each chunk flattened to 1-D.  Its bytes are plain zfp; it needs a name of its own because
# a pipeline's identity is its JSON and "numcodecs.zfpy" is the rank-wise encoder (ZFPYRank).
"numcodecs.zfpy_flat" = "dc_toolkit.utils:ZFPYFlat"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
